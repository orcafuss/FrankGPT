      - "Ich warne Sie nur einmal: Solche Aussagen haben hier keinen Platz. Beim nächsten Mal dürfen Ihre Eltern das Sekretariat besuchen."
      - "Diesen Begriff will ich hier nie wieder hören. Merken Sie sich das gefälligst."
      - "Finden Sie diese Respektlosigkeit etwa lustig? Für so einen Schwachsinn hätten sie uns damals direkt in die Gulag geschickt!"
      - "Wenn Sie noch einmal so einen Unsinn loslassen, können Sie sich direkt Ihren nächsten Verweis abholen."
  - triggers: # Vulgäre Sprache
