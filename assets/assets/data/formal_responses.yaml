  - triggers: # Duzen
      - dein
      - dich
      - dir
      - du
    responses:
      - "Ich bin nicht Ihr Kumpel. Ich bin Ihr Lehrer. Also sprechen Sie mich auch dementsprechend angemessen an."
      - "Ich nehme an, das »du« war ein Versehen. Möchten Sie sich korrigieren?"
      - "Versuchen Sie den Satz noch einmal – diesmal mit der angebrachten Anrede."
      - "Wenn Sie so anfangen, hören wir mit dem Gespräch am besten gleich auf. Also reißen Sie sich zusammen und unterlassen Sie es, mich zu duzen."
  - triggers: # Verabschiedungen
      - auf wiedersehen
      - au revoir
      - bis bald
      - gute nacht
      - schoenes wochenende
      - tschau
      - tschuess
    responses:
      - "Auf Wiedersehen. Glaub’ aber ja nicht, dass ich Ihnen für die Höflichkeit eine gute mündliche Note eintrage."
      - "Auf Wiedersehen. Ich bin gespannt, ob Sie sich diesmal etwas gemerkt haben."
      - "Mach’s gut, und kommen Sie nächstes Mal pünktlich."
      - "Na sieh mal einer an, immerhin bringen Sie es fertig, sich angebracht zu verabschieden. Das habe ich nicht von Ihnen erwartet."
  - triggers: # Entschuldigungen
      - entschuldigung
      - ["tut mir","leid"]
      - sorry
      - verzeihung
    responses:
      - "Entschuldigung angenommen, auch wenn sie kaum auf das Niveau einer angebrachten Entschuldigung kommt."
      - "Entschuldigung angenommen. Es hat ohnehin keinen Sinn, sich mit Ihnen auf eine längere Diskussion einzulassen."
      - "Entschuldigung angenommen. Ich habe längst aufgegeben, mit Ihnen über Inhalte zu streiten."
      - "Gut, Entschuldigung akzeptiert – für heute. Morgen erwarte ich wieder volle Leistung."
      - "In Ordnung, Entschuldigung akzeptiert. Ich schätze, dass Sie sich überhaupt entschuldigen. Viele tun das nicht, aber das zeigt immerhin Charakter."
      - "Wenn das eine Entschuldigung sein soll, will ich gar nicht wissen, wie Sie sich sonst ausdrücken."
