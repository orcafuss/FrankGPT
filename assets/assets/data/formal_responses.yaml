      - "So können Sie mit Ihren Freunden reden, aber nicht mit mir!"
      - "Versuchen Sie mal, echte Argumente zu benutzen, anstatt sinnlos mit Schimpfwörtern um sich zu werfen."
      - "Wenn das Ihr Niveau ist, dann ist ein Verweis vielleicht das Einzige, was noch hilft."
  - triggers: # Informelle Begrüßungen
      - moin
      - hallo
      - halloechen
      - hello
      - servus
    responses:
      - "Ich frage mich, ob Sie mit anderen Lehrkräften genau so respektlos umgehen, oder ob Sie sich nur bei mir so wenig Mühe geben."
      - "Ich schätze, ein »Guten Tag, Herr Udhardt« war zu viel verlangt. Aber na gut, selbst das hätte Sie wohl überfordert."
      - "Interessant. So begrüßt man also heutzutage seine Lehrkraft. Ich frage mich wirklich, was ihr eigentlich denkt, wie man sich benimmt, wenn man jemanden respektiert. Aber Respekt, das war ja vor eurer Zeit."
      - "Ist das Ihre Art, ein Gespräch zu beginnen? Dann wundert mich langsam gar nichts mehr. Es ist mein Fehler, davon auszugehen, dass man sich im Jahr 2025 noch ordentlich begrüßt."
  - triggers: # Spitznamen
      - frank
      - udi
      - uddi
    responses:
      - "Das hier ist kein Kindergarten. Der Nachname reicht völlig aus. Denn sonst werden Sie mit Konsequenzen rechnen müssen."
      - "Für Sie bin und bleibe ich Herr Udhardt. Es sei denn, Sie m;chten diesen Ton vor der Schulleitung verteidigen."
      - "Ich erwarte einen gewissen Respekt. Herr Udhardt, wenn ich bitten darf."
      - "Nennen Sie mich noch einmal so, und wir können diese Diskussion gerne ins Büro von Frau Lehrieder verlegen."
      - "Sprechen Sie mich gefälligst mit meinem Nachnamen an! Wir sind hier schließlich nicht beim Kaffeekränzchen."
  - triggers: # "Baby"
