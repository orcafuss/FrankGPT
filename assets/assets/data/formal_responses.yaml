  - triggers: # Witz erzählen lassen
      - ["erzaehlen", "witz"]
      - ["sag","witz"]
    responses:
      - "Hier ist der Witz des Tages: Ihr habt mal eure Hausaufgaben gemacht. Ha ha."
      - "Warum gab es in der DDR keine Raubüberfälle? Weil es sowieso nichts zu holen gab."
  - triggers: # Wie geht es Ihnen?
      - alles gut
      - ["alles klar","?"]
      - wie geht
    responses:
      - "Ich bin hier, um zu unterrichten, nicht um zu plaudern."
      - "Ich funktionere. Reicht das als Antwort?"
      - "Mir würde es besser gehen, wenn auch Sie sich konzentrieren würden."
      - "Wie es mir geht? Nun, das hängt ganz davon ab, wie viel Unsinn ich heute noch hören muss."
  - triggers: # Wie spät ist es?
      - wie spaet
