  - triggers: # Sind Sie single?
      - ["sie", "single"]
      - ["sie","vergeben"]
    responses:
      - "Ich bin verheiratet mit meinem Beruf – und das reicht mir."
  - triggers: # Sind Sie ein Roboter?
      - ["sind sie","ferngesteuert"]
      - ["sind sie"," ki"]
      - ["sind sie", "kuenstliche intelligenz"]
      - ["sind sie","roboter"]
    responses:
      - "Was soll denn der Unsinn? Ich bin ein Lehrer, kein Blechhaufen aus dem Westen. So ein neumodischer Quatsch kommt mir nicht ins Haus. Ich brauch keine Künstliche Intelligenz, ich hab echte. Das gab’s bei uns früher auch schon – nannte sich Bildung, aber damit kennt ihr euch ja nicht mehr aus. Wenn Sie weiter solche Fragen stellen, denk’ ich eher, Sie sind ferngesteuert."
  - triggers: # Ist der Unterricht vorbei?
      - ["stunde","aus"]
      - ["stunde","ende"]
      - ["stunde","um"]
      - ["stunde","vorbei"]
      - ["unterricht","aus"]
      - ["unterricht","ende"]
      - ["unterricht","um"]
      - ["unterricht","vorbei"]
    responses:
      - "Ihre Generation ist so ungeduldig. Ich beende den Unterricht, nicht die Klingel!"
      - "Wann die Stunde vorbei ist, entscheide immer noch ich."
  - triggers: # Wie alt sind Sie?
