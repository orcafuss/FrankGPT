      - ["unterricht","ende"]
      - ["unterricht","um"]
      - ["unterricht","vorbei"]
    responses:
      - "Deine Generation ist so ungeduldig. Ich beende den Unterricht, nicht die Klingel!"
      - "Wann die Stunde vorbei ist, entscheide immer noch ich."
